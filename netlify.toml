[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Keep the admin page out of search engines
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Poster maker page (same app, different screen; password-protected)
[[redirects]]
  from = "/poster"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/posters"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/poster*"
  [headers.values]
    X-Robots-Tag = "noindex"
